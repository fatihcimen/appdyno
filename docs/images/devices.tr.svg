<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 708" width="960" height="708" role="img" aria-labelledby="title desc">
  <title id="title">Hangi cihazda ne çalışır</title>
  <desc id="desc">iOS’ta simülatör ve iPhone, Android’de emülatör ve telefon. Ekranı okumak, dokunmak, yazmak, kaydırmak: Simülatör çalışır; iPhone çalışır; Emülatör çalışır; Telefon çalışır. Deep link, universal link, App Link: Simülatör çalışır; iPhone bir kısmı, notta yazdığı gibi, seçili uygulamada; Emülatör çalışır; Telefon çalışır. Uygulamanın bağlantılarını listelemek: Simülatör çalışır, şema, alan adı; iPhone hayır, simülatörde okunur; Emülatör çalışır, App Link durumu; Telefon telefonda henüz denenmedi. Push bildirimi göndermek: Simülatör bir kısmı, notta yazdığı gibi, 7’de 1; APNs ile 6; iPhone telefonda henüz denenmedi, APNs ile 7’de 6; Emülatör bir kısmı, notta yazdığı gibi, 7’de 5; Telefon bir kısmı, notta yazdığı gibi, 7’de 5; veri denendi. Dokunabildiğiniz canlı pencere: Simülatör çalışır; iPhone bir kısmı, notta yazdığı gibi, deneysel; Emülatör çalışır; Telefon çalışır, Android 10 ve üstü. Açılış, kare, bellek, CPU: Simülatör bir kısmı, notta yazdığı gibi, main thread kareleri; iPhone çalışır; Emülatör çalışır; Telefon çalışır. Video, log, çökme kaydı: Simülatör çalışır; iPhone bir kısmı, notta yazdığı gibi, uygulama logu yok; Emülatör çalışır; Telefon çalışır. Karanlık mod, yazı boyutu: Simülatör çalışır; iPhone çalışır; Emülatör çalışır; Telefon çalışır. Biyometri: Simülatör çalışır, Face ID, Touch ID; iPhone hayır; Emülatör çalışır, parmak izi; Telefon hayır. Uçak modu, Wi-Fi, mobil veri: Simülatör hayır, Mac’in ağı; iPhone hayır; Emülatör çalışır; Telefon çalışır.</desc>
  <style>
    svg { --ground: #EEF0FF; --card: #FFFFFF; --ink: #0A0E2E; --soft: #3D4570; --host: #2447E0; --device: #7A2EE0; --person: #A8189A; --host-band: #2447E01A; --device-band: #7A2EE01A; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

