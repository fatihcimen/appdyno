<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
  <title id="title">What appdyno is</title>
  <desc id="desc">An AI agent, a person, or a script asks. appdyno runs on your Mac and drives, shows, measures and keeps. It reaches an iOS simulator, an iPhone, an Android emulator and an Android phone. It has no cloud, no telemetry and no daemon.</desc>
  <style>
    svg { --ground: #EEF0FF; --card: #FFFFFF; --ink: #0A0E2E; --soft: #3D4570; --host: #2447E0; --device: #7A2EE0; --person: #A8189A; --host-band: #2447E01A; --device-band: #7A2EE01A; }
    @media (prefers-color-scheme: dark) {
      svg { --ground: #0A0E2E; --card: #151B4A; --ink: #EEF0FF; --soft: #B9C3EA; --host: #7EA2FF; --device: #5FD0F7; --person: #FF7FD0; --host-band: #3F6BFF26; --device-band: #7A3DF033; }
    }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="ground" width="960" height="500" rx="16"/>

  <text class="label" x="44" y="50">WHO ASKS</text>
  <rect class="card s-p" x="32" y="66" width="214" height="112" rx="12"/>
  <text class="name" x="52" y="110">An AI agent</text>
  <text class="text" x="52" y="134">any MCP client</text>
  <rect class="card s-p" x="32" y="194" width="214" height="112" rx="12"/>
  <text class="name" x="52" y="238">A person</text>
  <text class="text" x="52" y="262">the Mac app's window</text>
  <rect class="card s-p" x="32" y="322" width="214" height="112" rx="12"/>
  <text class="name" x="52" y="366">A script or CI</text>
  <text class="text" x="52" y="390">the command line,</text>
  <text class="text" x="52" y="410">a TypeScript library</text>

  <rect class="band-h" x="300" y="24" width="336" height="452" rx="20"/>
  <text class="label" x="324" y="50">YOUR MAC</text>
  <rect class="card s-h" x="316" y="66" width="304" height="368" rx="12"/>
  <text class="big" x="340" y="106">appdyno</text>
  <text class="name on-h" x="340" y="150">Drive</text>
  <text class="text" x="340" y="174">read the screen, tap, type, swipe</text>
  <text class="name on-h" x="340" y="222">Show</text>
  <text class="text" x="340" y="246">a live window, video, logs, crashes</text>
  <text class="name on-h" x="340" y="294">Measure</text>
  <text class="text" x="340" y="318">frames, memory, CPU, launch time</text>
  <text class="name on-h" x="340" y="366">Keep</text>
  <text class="text" x="340" y="390">flows to replay, baselines to gate on</text>
  <text class="note mid" x="468" y="458">no cloud, no telemetry, no daemon</text>

  <rect class="band-d" x="690" y="24" width="246" height="452" rx="20"/>
  <text class="label" x="714" y="50">YOUR DEVICES</text>
  <rect class="card s-d" x="706" y="66" width="214" height="82" rx="12"/>
  <text class="name" x="724" y="100">iOS simulator</text>
  <text class="text" x="724" y="124">helpers and a runner</text>
  <rect class="card s-d" x="706" y="162" width="214" height="82" rx="12"/>
  <text class="name" x="724" y="196">iPhone</text>
  <text class="text" x="724" y="220">a runner</text>
  <rect class="card s-d" x="706" y="258" width="214" height="82" rx="12"/>
  <text class="name" x="724" y="292">Android emulator</text>
  <text class="text" x="724" y="316">an agent</text>
  <rect class="card s-d" x="706" y="354" width="214" height="82" rx="12"/>
  <text class="name" x="724" y="388">Android phone</text>
  <text class="text" x="724" y="412">an agent</text>

  <path class="line s-p" marker-end="url(#ap)" d="M246 122H314"/>
  <path class="line s-p" marker-end="url(#ap)" d="M246 250H314"/>
  <path class="line s-p" marker-end="url(#ap)" d="M246 378H314"/>
  <path class="line s-d" marker-end="url(#ad)" d="M620 107H704"/>
  <path class="line s-d" marker-end="url(#ad)" d="M620 203H704"/>
  <path class="line s-d" marker-end="url(#ad)" d="M620 299H704"/>
  <path class="line s-d" marker-end="url(#ad)" d="M620 395H704"/>
</svg>
