<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Performans kapısı nasıl karar verir</title>
  <desc id="desc">Bir çalıştırmanın her ölçümü sırayla değerlendirilir. Baseline yoksa new olur. Başka bir build ya da derleme durumuyla refused olur. Tabanını aşacak kadar oynamadıysa ok olur. Çok az çalıştırma ya da örnekle few-samples olur. Daha iyi bir değişiklik, sıra testi de aynı şeyi söylüyorsa improvement’tır, değilse ok. Sıra testinin doğrulamadığı daha kötü bir değişiklik noisy’dir, p 0,05 ya da üstündeyse ok; yük, ısı ya da açık bir yansıtma altında ölçülen de noisy’dir; değilse regression’dır. ok, improvement ve new 0 ile çıkar. Geri kalan her şey ve aşılan bir bütçe 1 ile çıkar.</desc>
  <style>
    svg { --ground: #0A0E2E; --card: #151B4A; --ink: #EEF0FF; --soft: #B9C3EA; --host: #7EA2FF; --device: #5FD0F7; --person: #FF7FD0; --host-band: #3F6BFF26; --device-band: #7A3DF033; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="ground" width="960" height="760" rx="16"/>

  <text class="label" x="40" y="44">BİR ÇALIŞTIRMANIN BİR ÖLÇÜMÜ, BASELINE’A KARŞI</text>
  <text class="label" x="660" y="44">KARAR</text>

  <!-- the questions, in the order compareMetric asks them -->
  <rect class="card s-h" x="32" y="60" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="88">Baseline bu ölçümü içeriyor mu?</text>
  <text class="text" x="52" y="109">henüz karşılaştıracak bir şey yok</text>

  <rect class="card s-h" x="32" y="146" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="174">Aynı build ve derleme durumu mu?</text>
  <text class="text" x="52" y="195">bir debug çalıştırma bir release baseline’a karşı bir şey söylemez</text>

  <rect class="card s-h" x="32" y="232" width="560" height="84" rx="12"/>
  <text class="name" x="52" y="260">Tabanı aştı mı?</text>
  <text class="text" x="52" y="281">bir süre için şunların en büyüğü: %15, 10 ms ve baseline’ın</text>
  <text class="text" x="52" y="301">çalıştırma medyanlarının 4 standart sapması</text>

  <rect class="card s-h" x="32" y="340" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="368">Karar vermeye yetecek kadar var mı?</text>
  <text class="text" x="52" y="389">3 baseline çalıştırması ve her iki yanda 5 örnek</text>

  <rect class="card s-h" x="32" y="426" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="454">Daha mı kötü?</text>
  <text class="text" x="52" y="475">hangi yönün sayıldığını ölçümün kendisi belirler</text>

  <rect class="card s-h" x="32" y="512" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="540">Bir sıra testi de aynı şeyi söylüyor mu?</text>
  <text class="text" x="52" y="561">p &lt; 0,01, bütün baseline örnekleri çalıştırmaya karşı; 0,05 ya da üstünde ok</text>

  <rect class="card s-h" x="32" y="598" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="626">Çalıştırma ya da baseline gürültülü müydü?</text>
  <text class="text" x="52" y="647">bu Mac’te ya da cihazda yüksek yük, ısınmış bir cihaz, açık bir yansıtma</text>

  <!-- down: the way on -->
  <path class="line s-h" marker-end="url(#ah)" d="M312 122V144"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 208V230"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 316V338"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 402V424"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 488V510"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 574V596"/>
  <text class="text" x="322" y="138">evet</text>
  <text class="text" x="322" y="224">evet</text>
  <text class="text" x="322" y="332">evet</text>
  <text class="text" x="322" y="418">evet</text>
  <text class="text" x="322" y="504">evet</text>
  <text class="text" x="322" y="590">evet</text>

  <!-- across: where a question ends it -->
  <path class="line s-d" marker-end="url(#ad)" d="M592 91H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 177H656"/>
  <path class="line s-d" marker-end="url(#ad)" d="M592 274H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 371H656"/>
  <path class="line s-d" marker-end="url(#ad)" d="M592 457H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 543H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 629H656"/>
  <text class="text mid" x="622" y="84">hayır</text>
  <text class="text mid" x="622" y="170">hayır</text>
  <text class="text mid" x="622" y="267">hayır</text>
  <text class="text mid" x="622" y="364">hayır</text>
  <text class="text mid" x="622" y="450">hayır</text>
  <text class="text mid" x="622" y="536">hayır</text>
  <text class="text mid" x="622" y="622">evet</text>

  <!-- the verdicts: teal or violet passes, pink stops -->
  <rect class="card s-d" x="658" y="72" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="97">new</text>
  <text class="text end" x="912" y="97">geçer</text>
  <rect class="card s-p" x="658" y="158" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="183">refused</text>
  <text class="text end" x="912" y="183">geçmez</text>
  <rect class="card s-d" x="658" y="255" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="280">ok</text>
  <text class="text end" x="912" y="280">geçer</text>
  <rect class="card s-p" x="658" y="352" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="377">few-samples</text>
  <text class="text end" x="912" y="377">geçmez</text>
  <rect class="card s-d" x="658" y="438" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="463">improvement ya da ok</text>
  <text class="text end" x="912" y="463">geçer</text>
  <rect class="card s-p" x="658" y="524" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="549">noisy</text>
  <text class="text end" x="912" y="549">yeniden ölçün</text>
  <rect class="card s-p" x="658" y="610" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="635">noisy</text>
  <text class="text end" x="912" y="635">yeniden ölçün</text>

  <!-- the last way out -->
  <path class="line s-p" marker-end="url(#ap)" d="M312 660V692H656"/>
  <text class="text" x="322" y="682">hayır</text>
  <rect class="card s-p" x="658" y="674" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="699">regression</text>
  <text class="text end" x="912" y="699">job’ı durdurur</text>

  <text class="note" x="40" y="738">ok, improvement ve new’de çıkış 0. Geri kalan her şeyde ve aşılan bir bütçede çıkış 1.</text>
</svg>
