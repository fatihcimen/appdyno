<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
  <title id="title">One call, one answer</title>
  <desc id="desc">An AI agent asks for something in plain words and calls a tool, here a tap on Dark. appdyno, on your Mac, finds the element on a fresh read of the screen and does it on the device. The device is watched until its screen has been still for 200 ms, at most 3 s. The agent gets back the settled screen and what changed, in the same answer: no second call to look, and no fixed sleep.</desc>
  <style>
    svg { --ground: #0A0E2E; --card: #151B4A; --ink: #EEF0FF; --soft: #B9C3EA; --host: #7EA2FF; --device: #5FD0F7; --person: #FF7FD0; --host-band: #3F6BFF26; --device-band: #7A3DF033; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="ground" width="960" height="440" rx="16"/>

  <!-- the agent -->
  <text class="label" x="44" y="50">YOUR AI AGENT</text>
  <rect class="card s-p" x="32" y="66" width="250" height="150" rx="12"/>
  <text class="name" x="52" y="98">Asks</text>
  <text class="text" x="52" y="122">Turn on dark mode, and</text>
  <text class="text" x="52" y="142">show me what changed.</text>
  <text class="code" x="52" y="176">tap {"selector":</text>
  <text class="code" x="68" y="196">{"text":"Dark"}}</text>

  <rect class="card s-p" x="32" y="236" width="250" height="164" rx="12"/>
  <text class="name" x="52" y="268">Gets back, at once</text>
  <text class="text" x="52" y="292">the screen after it, settled,</text>
  <text class="text" x="52" y="312">and what changed</text>
  <text class="code" x="52" y="344">tapped @p8ge "Dark"</text>
  <text class="code" x="52" y="364">screen changed: +0 -0 ~3</text>
  <text class="code" x="52" y="384">settled: true</text>

  <!-- appdyno -->
  <rect class="band-h" x="306" y="24" width="360" height="376" rx="20"/>
  <text class="label" x="326" y="50">APPDYNO, ON YOUR MAC</text>

  <rect class="card s-h" x="322" y="66" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="102" r="15"/>
  <text class="name on-h mid" x="352" y="108">1</text>
  <text class="name" x="380" y="97">Finds it</text>
  <text class="text" x="380" y="121">on a fresh read: by text, id or ref</text>

  <rect class="card s-h" x="322" y="156" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="192" r="15"/>
  <text class="name on-h mid" x="352" y="198">2</text>
  <text class="name" x="380" y="187">Does it</text>
  <text class="text" x="380" y="211">a tap, a swipe, a push, a link</text>

  <rect class="card s-h" x="322" y="270" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="306" r="15"/>
  <text class="name on-h mid" x="352" y="312">4</text>
  <text class="name" x="380" y="301">Answers</text>
  <text class="text" x="380" y="325">with the screen, once it is still</text>

  <!-- the device -->
  <rect class="band-d" x="696" y="24" width="240" height="376" rx="20"/>
  <text class="label" x="716" y="50">THE DEVICE</text>
  <rect class="card s-d" x="746" y="66" width="140" height="236" rx="24"/>
  <rect class="f-d" x="796" y="78" width="40" height="10" rx="5"/>
  <text class="name mid" x="816" y="122">Appearance</text>
  <rect class="card s-d" x="762" y="138" width="108" height="34" rx="8"/>
  <text class="note" x="776" y="160">Light</text>
  <rect class="card s-d" x="762" y="182" width="108" height="34" rx="8"/>
  <text class="note" x="776" y="204">Dark</text>
  <circle class="f-d" cx="852" cy="199" r="5"/>
  <path class="rule" d="M766 240H866"/>
  <path class="rule" d="M766 260H866"/>
  <path class="rule" d="M766 280H846"/>

  <circle class="card s-d" cx="724" cy="340" r="15"/>
  <text class="name on-d mid" x="724" y="346">3</text>
  <text class="name" x="748" y="335">Waits</text>
  <text class="text" x="748" y="359">until still for 200 ms,</text>
  <text class="text" x="748" y="379">at most 3 s</text>

  <!-- the way there and back -->
  <path class="line s-p" marker-end="url(#ap)" d="M282 102H320"/>
  <path class="line s-h" marker-end="url(#ah)" d="M486 138V154"/>
  <path class="line s-h" marker-end="url(#ah)" d="M650 192H744"/>
  <path class="line s-d" marker-end="url(#ad)" d="M746 290H652"/>
  <path class="line s-d" marker-end="url(#ad)" d="M322 318H284"/>

  <text class="note mid" x="480" y="424">One call, one answer: no second call to look, and no fixed sleep.</text>
</svg>
