<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" role="img" aria-labelledby="title desc">
  <title id="title">A person approves what loses data</title>
  <desc id="desc">An AI agent asks to clear an app's data. appdyno stops, as this loses what a person may want, and asks the person by the client's own prompt, naming the app, the device and what is lost. The person says yes, and only then does appdyno clear the data on the device and answer the agent. On a no, or no answer, nothing is done and the agent is told so. Nothing the agent sends counts as a yes.</desc>
  <style>
    svg { --ground: #EEF0FF; --card: #FFFFFF; --ink: #0A0E2E; --soft: #3D4570; --host: #2447E0; --device: #7A2EE0; --person: #A8189A; --host-band: #2447E01A; --device-band: #7A2EE01A; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="ground" width="960" height="476" rx="16"/>

  <!-- the agent -->
  <text class="label" x="44" y="50">YOUR AI AGENT</text>
  <rect class="card s-p" x="32" y="66" width="250" height="150" rx="12"/>
  <text class="name" x="52" y="98">Asks</text>
  <text class="text" x="52" y="122">Start the app over:</text>
  <text class="text" x="52" y="142">clear its data.</text>
  <text class="code" x="52" y="176">app {"action":"clear",</text>
  <text class="code" x="52" y="196">"app":"dev.appdyno.fixture"}</text>

  <rect class="card s-p" x="32" y="236" width="250" height="196" rx="12"/>
  <text class="name" x="52" y="268">Gets back</text>
  <text class="text" x="52" y="292">on a yes, once it is done</text>
  <text class="code" x="52" y="318">cleared the data of</text>
  <text class="code" x="52" y="338">dev.appdyno.fixture</text>
  <text class="text" x="52" y="370">on a no, or no answer</text>
  <text class="code" x="52" y="396">PERMISSION_REQUIRED</text>
  <text class="code" x="52" y="416">nothing was done</text>

  <!-- appdyno -->
  <rect class="band-h" x="306" y="24" width="360" height="408" rx="20"/>
  <text class="label" x="326" y="50">APPDYNO, ON YOUR MAC</text>

  <rect class="card s-h" x="322" y="66" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="102" r="15"/>
  <text class="name on-h mid" x="352" y="108">1</text>
  <text class="name" x="380" y="97">Stops</text>
  <text class="text" x="380" y="121">this loses data: a person decides</text>

  <rect class="card s-h" x="322" y="156" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="192" r="15"/>
  <text class="name on-h mid" x="352" y="198">2</text>
  <text class="name" x="380" y="187">Asks the person</text>
  <text class="text" x="380" y="211">in the client's own prompt</text>

  <rect class="card s-h" x="322" y="300" width="328" height="72" rx="12"/>
  <circle class="card s-h" cx="352" cy="336" r="15"/>
  <text class="name on-h mid" x="352" y="342">4</text>
  <text class="name" x="380" y="331">Runs it</text>
  <text class="text" x="380" y="355">on the device, after the yes</text>

  <text class="text" x="326" y="410">A client that cannot ask is refused.</text>

  <!-- the person -->
  <text class="label" x="716" y="50">THE PERSON</text>
  <rect class="card s-p" x="706" y="66" width="230" height="200" rx="14"/>
  <text class="note" x="724" y="98">Clear the data of</text>
  <text class="note" x="724" y="120">dev.appdyno.fixture on</text>
  <text class="note" x="724" y="142">iPhone 17 Pro (…)?</text>
  <text class="text" x="724" y="170">All it keeps there is</text>
  <text class="text" x="724" y="190">lost for good.</text>
  <rect class="card s-p" x="722" y="214" width="96" height="34" rx="8"/>
  <text class="note mid" x="770" y="236">Decline</text>
  <rect class="card s-p" x="826" y="214" width="96" height="34" rx="8"/>
  <text class="note" x="846" y="236">Accept</text>
  <circle class="f-p" cx="906" cy="231" r="5"/>

  <circle class="card s-p" cx="724" cy="336" r="15"/>
  <text class="name on-p mid" x="724" y="342">3</text>
  <text class="name" x="748" y="331">Says yes</text>
  <text class="text" x="748" y="355">the agent cannot</text>
  <text class="text" x="748" y="375">answer for them</text>

  <!-- the way there and back -->
  <path class="line s-p" marker-end="url(#ap)" d="M282 102H320"/>
  <path class="line s-h" marker-end="url(#ah)" d="M486 138V154"/>
  <path class="line s-h" marker-end="url(#ah)" d="M650 192H704"/>
  <path class="line s-p" marker-end="url(#ap)" d="M724 266V319"/>
  <path class="line s-p" marker-end="url(#ap)" d="M708 336H652"/>
  <path class="line s-h" marker-end="url(#ah)" d="M322 336H284"/>

  <text class="note mid" x="480" y="458">A yes is the person's alone: nothing the agent sends stands for one.</text>
</svg>
