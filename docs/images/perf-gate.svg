<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title desc">
  <title id="title">How the performance gate decides</title>
  <desc id="desc">Each measure of a run is judged in order. With no baseline it is new. With another build or compile state it is refused. If it did not move past its floor it is ok. With too few runs or samples it is few-samples. A better change is an improvement where the rank test agrees, and otherwise ok. A worse change the rank test does not confirm is noisy, or ok at p 0.05 or more, and one measured under load, heat or a mirror is noisy too; otherwise it is a regression. ok, improvement and new exit 0. Everything else, and a broken budget, exits 1.</desc>
  <style>
    svg { --ground: #EEF0FF; --card: #FFFFFF; --ink: #0A0E2E; --soft: #3D4570; --host: #2447E0; --device: #7A2EE0; --person: #A8189A; --host-band: #2447E01A; --device-band: #7A2EE01A; }
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .ground { fill: var(--ground); }
    .band-h { fill: var(--host-band); }
    .band-d { fill: var(--device-band); }
    .card { fill: var(--card); stroke-width: 1.5; }
    .s-h { stroke: var(--host); }
    .s-d { stroke: var(--device); }
    .s-p { stroke: var(--person); }
    .f-h { fill: var(--host); }
    .f-d { fill: var(--device); }
    .f-p { fill: var(--person); }
    .line { fill: none; stroke-width: 2; }
    .rule { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 3 5; }
    .dash { stroke-dasharray: 6 5; }
    .label { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; fill: var(--soft); }
    .big { font-size: 22px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 600; }
    .text { font-size: 14px; fill: var(--soft); }
    .note { font-size: 14px; fill: var(--ink); }
    .code { font-size: 13px; fill: var(--soft); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .on-h { fill: var(--host); font-weight: 600; }
    .on-d { fill: var(--device); font-weight: 600; }
    .on-p { fill: var(--person); font-weight: 600; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-h" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-d" d="M0 0 10 5 0 10z"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="f-p" d="M0 0 10 5 0 10z"/></marker>
  </defs>

  <rect class="ground" width="960" height="760" rx="16"/>

  <text class="label" x="40" y="44">ONE MEASURE OF A RUN, AGAINST THE BASELINE</text>
  <text class="label" x="660" y="44">THE VERDICT</text>

  <!-- the questions, in the order compareMetric asks them -->
  <rect class="card s-h" x="32" y="60" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="88">Does the baseline hold this measure?</text>
  <text class="text" x="52" y="109">nothing to compare with yet</text>

  <rect class="card s-h" x="32" y="146" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="174">The same build and compile state?</text>
  <text class="text" x="52" y="195">a debug run says nothing against a release baseline</text>

  <rect class="card s-h" x="32" y="232" width="560" height="84" rx="12"/>
  <text class="name" x="52" y="260">Did it move past the floor?</text>
  <text class="text" x="52" y="281">for a time, the largest of 15 %, 10 ms, and 4 standard</text>
  <text class="text" x="52" y="301">deviations of the baseline's run medians</text>

  <rect class="card s-h" x="32" y="340" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="368">Is there enough to call it?</text>
  <text class="text" x="52" y="389">3 baseline runs, and 5 samples on each side</text>

  <rect class="card s-h" x="32" y="426" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="454">Is it worse?</text>
  <text class="text" x="52" y="475">which way counts is the measure's own</text>

  <rect class="card s-h" x="32" y="512" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="540">Does a rank test agree?</text>
  <text class="text" x="52" y="561">p &lt; 0.01, all baseline samples against the run; at 0.05 or more, ok</text>

  <rect class="card s-h" x="32" y="598" width="560" height="62" rx="12"/>
  <text class="name" x="52" y="626">Was the run or the baseline measured under load?</text>
  <text class="text" x="52" y="647">high load on this Mac or the device, a hot device, a mirror open</text>

  <!-- down: the way on -->
  <path class="line s-h" marker-end="url(#ah)" d="M312 122V144"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 208V230"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 316V338"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 402V424"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 488V510"/>
  <path class="line s-h" marker-end="url(#ah)" d="M312 574V596"/>
  <text class="text" x="322" y="138">yes</text>
  <text class="text" x="322" y="224">yes</text>
  <text class="text" x="322" y="332">yes</text>
  <text class="text" x="322" y="418">yes</text>
  <text class="text" x="322" y="504">yes</text>
  <text class="text" x="322" y="590">yes</text>

  <!-- across: where a question ends it -->
  <path class="line s-d" marker-end="url(#ad)" d="M592 91H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 177H656"/>
  <path class="line s-d" marker-end="url(#ad)" d="M592 274H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 371H656"/>
  <path class="line s-d" marker-end="url(#ad)" d="M592 457H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 543H656"/>
  <path class="line s-p" marker-end="url(#ap)" d="M592 629H656"/>
  <text class="text mid" x="622" y="84">no</text>
  <text class="text mid" x="622" y="170">no</text>
  <text class="text mid" x="622" y="267">no</text>
  <text class="text mid" x="622" y="364">no</text>
  <text class="text mid" x="622" y="450">no</text>
  <text class="text mid" x="622" y="536">no</text>
  <text class="text mid" x="622" y="622">yes</text>

  <!-- the verdicts: teal or violet passes, pink stops -->
  <rect class="card s-d" x="658" y="72" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="97">new</text>
  <text class="text end" x="912" y="97">passes</text>
  <rect class="card s-p" x="658" y="158" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="183">refused</text>
  <text class="text end" x="912" y="183">no pass</text>
  <rect class="card s-d" x="658" y="255" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="280">ok</text>
  <text class="text end" x="912" y="280">passes</text>
  <rect class="card s-p" x="658" y="352" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="377">few-samples</text>
  <text class="text end" x="912" y="377">no pass</text>
  <rect class="card s-d" x="658" y="438" width="270" height="38" rx="19"/>
  <text class="name on-d" x="678" y="463">improvement or ok</text>
  <text class="text end" x="912" y="463">passes</text>
  <rect class="card s-p" x="658" y="524" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="549">noisy</text>
  <text class="text end" x="912" y="549">measure again</text>
  <rect class="card s-p" x="658" y="610" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="635">noisy</text>
  <text class="text end" x="912" y="635">measure again</text>

  <!-- the last way out -->
  <path class="line s-p" marker-end="url(#ap)" d="M312 660V692H656"/>
  <text class="text" x="322" y="682">no</text>
  <rect class="card s-p" x="658" y="674" width="270" height="38" rx="19"/>
  <text class="name on-p" x="678" y="699">regression</text>
  <text class="text end" x="912" y="699">stops the job</text>

  <text class="note" x="40" y="738">Exit 0 on ok, improvement and new. Exit 1 on all the rest, and on a broken budget.</text>
</svg>
