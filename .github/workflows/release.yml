name: release

# A tag publishes: `git tag v1.2.3 && git push origin v1.2.3`, for the version every package carries.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] actionlint 1.7.12, the newest, refuses GitHub's newer $/ form

  publish:
    needs: gate
    runs-on: macos-latest
    permissions:
      # the GitHub release
      contents: write
      # what `--provenance` signs with
      id-token: write
    env:
      APPDYNO_CERTIFICATE: ${{ secrets.APPDYNO_CERTIFICATE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/appdyno/package.json').version")"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # its npm can publish by trusted publishing too, which the 22's cannot
          node-version: 26
          registry-url: https://registry.npmjs.org
          # what is published is built from what the tag holds, and from no cache another run could have written
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # uvx runs dmgbuild, which writes the disk image's window: uv as .mise.toml pins it, by its digest
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          checksum: 81b811b57e4624df7ed3aac148e0359100d9962f3d9dce00aec533dc2e086731
          enable-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Android agent
        run: cd android && ./gradlew --console=plain :agent:assembleDebug
      - run: pnpm build
      - name: The signing certificate
        if: env.APPDYNO_CERTIFICATE != ''
        env:
          APPDYNO_CERTIFICATE_PASSWORD: ${{ secrets.APPDYNO_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPDYNO_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPDYNO_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
      - name: The Mac app
        # refuses a build that is not signed and notarized
        run: node scripts/build-app.mjs --release
        env:
          APPDYNO_SIGN_IDENTITY: ${{ secrets.APPDYNO_SIGN_IDENTITY }}
          APPDYNO_NOTARY_APPLE_ID: ${{ secrets.APPDYNO_NOTARY_APPLE_ID }}
          APPDYNO_NOTARY_PASSWORD: ${{ secrets.APPDYNO_NOTARY_PASSWORD }}
          APPDYNO_NOTARY_TEAM: ${{ secrets.APPDYNO_NOTARY_TEAM }}
          APPDYNO_UPDATE_KEY: ${{ secrets.APPDYNO_UPDATE_KEY }}
      - name: Publish with provenance
        working-directory: packages/appdyno
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: The release
        # with no update key there is no appcast
        run: |
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --generate-notes .app-build/*.dmg .app-build/appdyno.rb .app-build/appcast.json*
        env:
          GH_TOKEN: ${{ github.token }}
