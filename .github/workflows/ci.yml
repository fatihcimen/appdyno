name: ci

on:
  # main as it moves; any other branch runs once, by its pull request
  push:
    branches: [main]
  pull_request:
  # the gate of a release
  workflow_call:

permissions:
  contents: read

# a newer push to a branch or a pull request leaves the run before it nothing to say
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    # a run takes 12 to 27 minutes: a hang ends here, not at GitHub's six hours
    timeout-minutes: 45
    strategy:
      matrix:
        # the long-term release we develop on, and the oldest that engines lets in
        node: [26, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      # the native linters ask nothing of Node: once is enough
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: matrix.node == 26
        with:
          version: 2026.11.4
          # the linters .mise.toml pins: Node, pnpm and Java are the steps above
          install_args: uv pipx:clang-format shellcheck shfmt actionlint zizmor swiftlint ktlint
      - run: pnpm install --frozen-lockfile
      # on both: eslint and its typescript-eslint run on the Node a contributor has
      - run: pnpm lint
      - name: Native lint
        if: matrix.node == 26
        run: scripts/lint-native.sh
        env:
          # the audits of zizmor that ask GitHub
          GH_TOKEN: ${{ github.token }}
      - run: pnpm typecheck
      - run: pnpm test
      # before `pnpm build`, which packages it
      - name: Android agent
        run: cd android && ./gradlew --console=plain :agent:testDebugUnitTest :agent:assembleDebug
      - run: pnpm build
      - name: Runner core unit tests
        run: swift test --package-path ios/RunnerCore
