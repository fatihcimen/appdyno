name: ci

on:
  push:
  pull_request:
  # the gate of a release
  workflow_call:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm build` packages the agent, and stops when there is none
      - name: Android agent
        run: cd android && ./gradlew --console=plain :agent:testDebugUnitTest :agent:assembleDebug
      - run: pnpm build
      - name: Runner core unit tests
        run: swift test --package-path ios/RunnerCore
