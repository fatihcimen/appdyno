name: ci

on:
  push:
  pull_request:
  # the gate of a release
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    strategy:
      matrix:
        # the long-term release we develop on, and the oldest that engines lets in
        node: [26, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # before `pnpm build`, which packages it
      - name: Android agent
        run: cd android && ./gradlew --console=plain :agent:testDebugUnitTest :agent:assembleDebug
      - run: pnpm build
      - name: Runner core unit tests
        run: swift test --package-path ios/RunnerCore
