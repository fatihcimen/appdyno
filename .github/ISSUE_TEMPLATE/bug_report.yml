name: Bug report
description: Something did not work as the docs say. English or Turkish.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: appdyno doctor
      description: Paste the output of `appdyno doctor`. Check it first for anything you would rather not share, such as a device id.
      render: text
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iOS simulator
        - iPhone
        - Android emulator
        - Android phone
        - Not about a device
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Device model and OS version
      description: For example "Pixel 8, Android 15" or "iPhone 17 simulator, iOS 27.2". No serial number or UDID.
  - type: textarea
    id: call
    attributes:
      label: The call and its answer
      description: The tool call or command that failed, and its answer, which starts with an error code. Take out tokens, account names and anything on the screen you would not share.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `appdyno --version`.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      description: The client you use, if any, and its version.
